version: "2"

run:
  timeout: 5m
  go: "1.25"
  tests: true
  # The integration, envtest and e2e suites are behind build tags, so
  # without listing them here golangci-lint would skip those files
  # entirely — the tiers most likely to rot go unlinted.
  build-tags:
    - integration
    - envtest
    - e2e

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        # Don't require doc comments on every exported symbol — interface
        # implementations would just duplicate the interface's docstring,
        # and the rule fires on const blocks even when the block has a
        # leading comment.
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - revive

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kryptonhq/runtime
