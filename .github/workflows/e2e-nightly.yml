name: e2e-nightly

# The heavy half of the e2e tier, kept off the PR path:
#
#   * the llama.cpp / Qwen model route, which pulls a multi-GB image plus
#     model weights — far too slow to run per PR
#   * a Kubernetes version matrix, to catch API deprecations before users do
#
# Also runs on every push to main so a regression is attributed to a specific
# merge rather than being discovered the next morning.

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      deploy_llm:
        description: "Run the llama.cpp model path"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: e2e k8s ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Chart.yaml declares kubeVersion ">=1.30.0-0"; test the range we
        # claim to support, oldest and newest.
        #
        # These four tags are the node images published by kind v0.29.0.
        # Bumping this list means bumping KIND_VERSION below to the release
        # that ships the new tags — a kind CLI older than its node images
        # fails `kind load docker-image` with "failed to detect containerd
        # snapshotter", after the images have already been built.
        k8s: ["1.30.13", "1.31.9", "1.32.5", "1.33.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: azure/setup-helm@v4

      - name: Create kind cluster (k8s ${{ matrix.k8s }})
        uses: helm/kind-action@v1
        with:
          # Must be the kind release that publishes the node images in the
          # matrix above. Keep in sync with KIND_VERSION in the Makefile.
          version: v0.29.0
          cluster_name: krypton-e2e
          node_image: kindest/node:v${{ matrix.k8s }}
          config: hack/kind.yaml

      - name: Install chainsaw
        run: GOBIN=/usr/local/bin go install github.com/kyverno/chainsaw@v0.2.12

      # Only the newest node image in the matrix runs the LLM path; running
      # it four times would burn most of an hour for no extra signal.
      - name: Run e2e
        env:
          CLUSTER: krypton-e2e
          SKIP_CLUSTER_CREATE: "true"
          DEPLOY_LLM: ${{ matrix.k8s == '1.33.1' && 'true' || 'false' }}
        run: make test-e2e

      - name: Collect cluster diagnostics
        if: failure()
        run: ./hack/e2e-diagnostics.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-k8s-${{ matrix.k8s }}
          path: /tmp/krypton-e2e-diagnostics
          retention-days: 14

  # Single status name summarising the matrix, same pattern as ci.yml and
  # release-images.yml.
  e2e-nightly:
    name: e2e-nightly
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix result
        run: |
          if [ "${{ needs.matrix.result }}" != "success" ]; then
            echo "e2e matrix did not succeed: ${{ needs.matrix.result }}"
            exit 1
          fi
          echo "e2e passed on every supported Kubernetes version."
