name: bump-version

# Triggered on every vX.Y.Z tag push. Opens a PR against main that
# bumps the version everywhere it's hardcoded:
#   * website/hugo.yaml           params.kryptonVersion (docs shortcodes + navbar)
#   * (extend here as more places need pinning)
#
# Merging the PR makes Vercel rebuild the docs site at the new
# version. No manual editing required.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to bump to (e.g. v0.3.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF##*/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag}"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in hugo.yaml
        id: bump
        run: |
          before=$(grep '^  kryptonVersion:' website/hugo.yaml || true)
          sed -i -E "s|^(  kryptonVersion: ).*|\1${{ steps.tag.outputs.tag }}|" website/hugo.yaml
          after=$(grep '^  kryptonVersion:' website/hugo.yaml || true)
          echo "before: ${before}"
          echo "after:  ${after}"
          if [ "$before" = "$after" ]; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.bump.outputs.noop == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          branch="chore/bump-docs-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add website/hugo.yaml
          git commit -m "chore: bump docs to ${TAG}"
          git push -u origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: bump docs to ${TAG}" \
            --body "Auto-generated by \`bump-version\` workflow on tag push of \`${TAG}\`. Merging this PR updates \`params.kryptonVersion\` in \`website/hugo.yaml\`; Vercel will then rebuild the docs site and the navbar badge / shortcodes will resolve to **${TAG}**."
