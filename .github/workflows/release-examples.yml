name: release-examples

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-examples-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: helloworld-agent
            dockerfile: examples/agent/python/helloworld/Dockerfile
            context: examples/agent/python/helloworld
          - name: adk-agent
            dockerfile: examples/agent/python/adk/Dockerfile
            context: examples/agent/python/adk
          - name: adk-go-agent
            dockerfile: examples/agent/go/Dockerfile
            context: examples/agent/go
          - name: langgraph-agent
            dockerfile: examples/agent/python/langgraph/Containerfile
            context: examples/agent/python/langgraph
          - name: mcp-hello
            dockerfile: examples/mcp/go/Dockerfile
            context: .
          - name: mcp-hello-py
            dockerfile: examples/mcp/python/Dockerfile
            context: examples/mcp/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kryptonhq/${{ matrix.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
