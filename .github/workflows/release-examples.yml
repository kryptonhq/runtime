name: release-examples

# Tag-driven CD. Builds and pushes a multi-arch (amd64 + arm64)
# manifest list per example in a single step.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-examples-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: kryptonhq

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example:
          - name: helloworld-agent
            dockerfile: examples/agent/python/helloworld/Dockerfile
            context: examples/agent/python/helloworld
          - name: adk-agent
            dockerfile: examples/agent/python/adk/Dockerfile
            context: examples/agent/python/adk
          - name: adk-go-agent
            dockerfile: examples/agent/go/Dockerfile
            context: examples/agent/go
          - name: langgraph-agent
            dockerfile: examples/agent/python/langgraph/Containerfile
            context: examples/agent/python/langgraph
          - name: mcp-hello
            dockerfile: examples/mcp/go/Dockerfile
            context: .
          - name: mcp-hello-py
            dockerfile: examples/mcp/python/Dockerfile
            context: examples/mcp/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.example.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.example.context }}
          file: ${{ matrix.example.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.example.name }}
          cache-to: type=gha,scope=${{ matrix.example.name }},mode=max
