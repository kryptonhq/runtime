apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: krypton.ai/v1alpha1
kind: Agent
metadata:
  name: mcp-hello
  namespace: agents
spec:
  image: ghcr.io/kryptonhq/mcp-hello:edge
  imagePullPolicy: Always
  runtime: go
  framework: stdlib
  protocol: mcp
  mode: always-on
  minReplicas: 1
  maxReplicas: 2
  concurrency: 8
  port: 8080
  invocationPath: /
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
