apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: krypton.ai/v1alpha1
kind: Agent
metadata:
  name: langgraph
  namespace: agents
spec:
  image: ghcr.io/kryptonhq/langgraph-agent:edge
  imagePullPolicy: Always
  runtime: python
  framework: langgraph
  protocol: a2a
  mode: always-on
  minReplicas: 1
  maxReplicas: 3
  concurrency: 4
  port: 10000
  invocationPath: /
  env:
    - name: GOOGLE_API_KEY
      valueFrom:
        secretKeyRef:
          name: langgraph-secrets
          key: GOOGLE_API_KEY
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
