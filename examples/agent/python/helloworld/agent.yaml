apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: krypton.ai/v1alpha1
kind: Agent
metadata:
  name: helloworld
  namespace: agents
spec:
  image: ghcr.io/kryptonhq/helloworld-agent:edge
  imagePullPolicy: Always
  runtime: python
  framework: a2a-sdk
  protocol: a2a
  mode: always-on
  minReplicas: 1
  maxReplicas: 2
  concurrency: 4
  port: 8080
  invocationPath: /
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits:   { cpu: 500m, memory: 256Mi }
