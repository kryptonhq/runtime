apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: krypton.ai/v1alpha1
kind: Agent
metadata:
  name: adk
  namespace: agents
spec:
  image: ghcr.io/kryptonhq/adk-agent:latest
  imagePullPolicy: Always
  runtime: python
  framework: google-adk
  protocol: a2a
  mode: always-on
  minReplicas: 1
  maxReplicas: 3
  concurrency: 4
  port: 8080
  invocationPath: /
  env:
    - name: PORT
      value: "8080"
    - name: GOOGLE_API_KEY
      valueFrom:
        secretKeyRef:
          name: adk-secrets
          key: GOOGLE_API_KEY
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
