{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krypton.fullname" . }}-manager
  labels: {{- include "krypton.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krypton.fullname" . }}-control-plane
  labels: {{- include "krypton.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krypton.fullname" . }}-gateway
  labels: {{- include "krypton.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krypton.fullname" . }}-manager
  labels: {{- include "krypton.labels" . | nindent 4 }}
rules:
  - apiGroups: ["krypton.ai"]
    resources: ["agents", "agents/status", "agents/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["krypton.ai"]
    resources: ["models", "models/status", "models/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "endpoints", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krypton.fullname" . }}-readonly
  labels: {{- include "krypton.labels" . | nindent 4 }}
rules:
  - apiGroups: ["krypton.ai"]
    resources: ["agents", "agents/status", "models", "models/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krypton.fullname" . }}-gateway
  labels: {{- include "krypton.labels" . | nindent 4 }}
rules:
  - apiGroups: ["krypton.ai"]
    resources: ["agents", "agents/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["krypton.ai"]
    resources: ["models", "models/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krypton.fullname" . }}-manager
  labels: {{- include "krypton.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "krypton.fullname" . }}-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "krypton.fullname" . }}-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krypton.fullname" . }}-control-plane
  labels: {{- include "krypton.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "krypton.fullname" . }}-control-plane
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "krypton.fullname" . }}-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krypton.fullname" . }}-gateway
  labels: {{- include "krypton.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "krypton.fullname" . }}-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "krypton.fullname" . }}-gateway
{{- end }}
