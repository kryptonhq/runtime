# Krypton Helm values. Production deploys should supply a managed
# Postgres DSN; for local kind testing the in-memory store is fine.

image:
  # Registry namespace for all Krypton component images. Each
  # component's image is `<registry>/<binary>:<tag>`, e.g.
  # ghcr.io/kryptonhq/gateway:0.1.0.
  registry: ghcr.io/kryptonhq
  # Empty default → krypton.image helper falls back to
  # Chart.AppVersion (set from the git tag at release-chart.yml
  # package time). Override to pin a different tag without
  # rebuilding the chart.
  tag: ""
  pullPolicy: IfNotPresent

# Per-component image overrides take precedence over registry/tag above.
images:
  manager: {}        # repository, tag, pullPolicy
  controlPlane: {}
  gateway: {}
  proxy: {}          # sidecar image used by the manager via --proxy-image

manager:
  replicas: 1
  enableWebhooks: false  # default off; turning on requires TLS plumbing
  enableScaler: true
  scalerIntervalMs: 1000
  scalerStableWindowMs: 60000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

controlPlane:
  replicas: 1
  databaseUrl: ""    # leave empty for in-memory; set for postgres mirror
  service:
    type: ClusterIP
    port: 8090
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

gateway:
  replicas: 1
  maxBufferPerAgent: 100
  pollIntervalMs: 50
  defaultStartupTimeoutMs: 30000
  service:
    type: ClusterIP   # operators add their own ingress for public traffic
    port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# Optional bundled Postgres for dev installs. Production should use a
# managed instance and just pass controlPlane.databaseUrl.
postgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    user: krypton
    password: krypton
    database: krypton
  persistence:
    enabled: false
    size: 1Gi

rbac:
  create: true

# --------------------------------------------------------------------------
# Prometheus Operator integration. Both monitors are off by default so the
# chart installs cleanly on clusters without the prometheus-operator CRDs.
# Flip them on if you run kube-prometheus-stack or Prometheus Operator.
# --------------------------------------------------------------------------

# Scrape the three runtime components (manager, control-plane, gateway)
# via their /metrics endpoints. One ServiceMonitor covers all three —
# Krypton's shared selectorLabels match every component Service.
serviceMonitor:
  enabled: false
  # Defaults to the chart's release namespace; override if your
  # Prometheus is scoped to a specific monitoring namespace.
  namespace: ""
  # Extra labels merged onto the CR — match these against your
  # Prometheus's `spec.serviceMonitorSelector`.
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []
  metricRelabelings: []

# Scrape the krypton-proxy sidecar in every Agent pod across all
# namespaces. Sidecars are injected by the manager and don't have
# their own Services, so PodMonitor (selecting by managed-by label)
# is the right shape.
podMonitor:
  enabled: false
  namespace: ""
  labels: {}
  # Watch agent pods anywhere; restrict to specific namespaces with
  #   namespaceSelector: { matchNames: [agents, prod-agents] }
  namespaceSelector: {}
  interval: 30s
  scrapeTimeout: 10s
